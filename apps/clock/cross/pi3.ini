# Cross file for the Raspberry Pi 3 A+ (32-bit Raspberry Pi OS, armhf).
# Needs: sudo apt install gcc-arm-linux-gnueabihf
#
# Binaries are linked statically so the newer host glibc (2.39) does not leak
# into the Pi's glibc (2.36).
[binaries]
c = 'arm-linux-gnueabihf-gcc'
ar = 'arm-linux-gnueabihf-ar'
strip = 'arm-linux-gnueabihf-strip'

[built-in options]
c_args = ['-mcpu=cortex-a53', '-mfpu=neon-vfpv4', '-mfloat-abi=hard']
c_link_args = ['-static']

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'
